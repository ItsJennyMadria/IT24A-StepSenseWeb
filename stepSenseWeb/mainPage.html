<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepSense Co.</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

     <style>
         h1 {
            text-align: center;
        }
        #map {
            height: 650px;
            flex: 2;
        }
        .popup-image{
            max-width: 200px;
            height: auto;
        }
        

     </style>

    
</head>

<body>

    <h1>StepSense</h1>
 <div class="container">
    <!--Weather Card-->
    <div id="weatherCard">
        <button onclick="getWeather()">Check Weather</button>
        <div id="weatherResult"></div>
    </div>

    <!-- Map Code-->
        <div id="map"></div>

        </div>
</body>

<script>
// -------------MAP SECTION----------->
let map;
let cityMarker = null;


    map = L.map('map').setView([8.3603, 124.8684], 17);

    const openStreetMap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy;openStreetMap contributors'
    }).addTo(map);

    const satellite = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { attribution: 'Tiles © Esri- Source: Esri, Maxar, Earthstar Geographics, GIS User Community' }
    );


    const markerGroups = {};

    fetch(mapDataUrl)
        .then(response => response.json())
        .then(data => {
            data.forEach(pin => {
                const type = pin.locationType || "Other";

                if (!markerGroups[type]) {
                    markerGroups[type] = L.layerGroup();
                }

                const marker = L.marker([pin.lat, pin.lng]).addTo(map);
                const img = `<img src="${pin.img}" class="popup-image">`;
                

                marker.bindPopup(`${img}<br><b>${pin.title}</b><br>${pin.description}<br>${pin.locationType}`);

                markerGroups[type].addLayer(marker);
            });

            Object.values(markerGroups).forEach(group => group.addTo(map));

            L.control.layers(
                {
                    "OpenStreetMap": openStreetMap,
                    "Satellite": satellite
                     },
                markerGroups,
                { collapsed: false }
            ).addTo(map);
        })
        .catch(err => console.error("Error loading JSON", err));


document.addEventListener("DOMContentLoaded", () => {
    initMap("campus-map.json");
});


//----------------Weather  Code------------------>
const apiKey = "71f1476d46775282b461831e0cef5202";
const geocodeUrl = "https://api.openweathermap.org/geo/1.0/direct";

    async function checkWeather(){
        const city = prompt("Enter the city you're at: ");
        if (!city) return alert ("No city entered.");
        
        const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

        try{
            const response = await fetch(weatherUrl);
            if(!response.ok) throw new Error("City not found.");
            const data = await response.json();

            const walkDecision = evaluateWalk(data);

              document.getElementById("weatherResult").innerHTML = `
            <h2>${data.name}, ${data.sys.country}</h2>
            <p><b>Temperature:</b> ${data.main.temp}°C</p>
            <p><b>Weather:</b> ${data.weather[0].description}</p>
            <p><b>Humidity:</b> ${data.main.humidity}%</p>
            <p><b>Wind:</b> ${data.wind.speed} m/s</p>

            <hr>
            <h3>Recommendation</h3>
            <p style="font-weight:bold; color:${walkDecision.color};">
                ${walkDecision.message}
            </p>
        `;

        const geoResponse = await fetch(`${geocodeUrl}?q=${city}&limit=1&appid=${apiKey}`);
        const geoData = await geoResponse.json();
        if (geoData.length === 0) return alert("Location not found.");

        const lat = geoData[0].lat;
        const lon = geoData[0].lon;

        if (cityMarker) map.removeLayer(cityMarker);

        cityMarker = L.marker([lat, lon]).addTo(map)
            .bindPopup(`<b>${city}</b><br>You are here!`)
            .openPopup();

        map.setView([lat, lon], 10);

    } catch (error) {
        alert("Error: " + error.message);
    }
}

        
</script>


</html>
